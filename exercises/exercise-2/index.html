<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Exercise 2</title>
    <style>
    .container {
        position:relative;
        z-index: 0;
        border: 10px solid rgb(117, 117, 117);
        padding: 0px; 
        width: 500;
        height: 500;
    }
    .blue-box1 {
        position: relative;
        z-index: 1;
        background: rgb(9, 53, 96);
        height: 200px;
        width: 200px;
        left: 50px;
        top:50px;
    }
    .red-box2 {
        position: absolute;
        z-index: 2;
        background: rgb(96, 9, 28);
        height: 200px;
        width: 200px;
        left: 150px;
        top:150px;
    }
    .green-box3{
        position: absolute;
        z-index: 3;
        background: rgb(5, 79, 21);
        height: 200px;
        width: 200px;
        left: 250px;
        top: 250px;}
</style>
</head>
<body>
    <h1>Exercise 2</h1>
    <div class="blue-box1"></div>
    <div class="red-box2"></div>
    <div class="green-box3"></div>

</body>
</html>
