<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name=""veiewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2</title>
    <style>
        .box {
          position: relative;
          z-index: 0; 
          padding: 10px;
          border: 10px solid rgb(117,117,117);
          width: 800px;
          height: 800px;

        }
        .box1 {
          position: absolute;
          z-index: 1; 
          top: 100px;
          left: 100px;
          border: 10px solid rgb(9, 53, 96);
          width: 400px;
          height: 400px;
        }
        .box2 {
          position: absolute;
          z-index: 2; 
          top: 215px;
          left: 215px;
          background-color: rgb(96, 9, 28);
          width: 400px;
          height: 400px;
        }
        .box3 {
          position: absolute;
          z-index: 3; 
          top: 330px;
          left: 330px;
          background-color: rgb(5, 79, 21);
          width: 400px;
          height: 400px;
        }
    </style> 
</head>
<body>
    <div class="box">
        <div class="box1"></div>
        <div class="box2"></div>            
        <div class="box3"></div>
    </div>
</body>
</html>
